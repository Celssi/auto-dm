# PHB 2024 weapon mastery properties (PHB p. 214). Short restatements for tooltips.
properties:
  cleave:
    label: Cleave
    summary: >
      Melee hit: make one extra attack against a second creature within 5 feet of the first
      and within your reach. Do not add your ability modifier to that damage unless it is
      negative. Once per turn.
  graze:
    label: Graze
    summary: >
      If the attack roll misses, you still deal damage equal to the ability modifier used
      for the attack, of the weapon's damage type.
  nick:
    label: Nick
    summary: >
      When you make the extra attack of the Light property, you can make it as part of the
      Attack action instead of a Bonus Action. Once per turn.
  push:
    label: Push
    summary: >
      On a hit, you can push a Large or smaller target up to 10 feet straight away from you.
      No saving throw.
  sap:
    label: Sap
    summary: On a hit, the target has Disadvantage on its next attack roll before the start of your next turn.
  slow:
    label: Slow
    summary: >
      On a hit that deals damage, reduce the target's Speed by 10 feet until the start of
      your next turn. This reduction does not stack above 10 feet.
  topple:
    label: Topple
    summary: >
      On a hit, the target makes a Constitution save (DC 8 + the attack's ability modifier
      + your Proficiency Bonus) or has the Prone condition.
  vex:
    label: Vex
    summary: >
      On a hit that deals damage, you have Advantage on your next attack roll against that
      target before the end of your next turn.
