# D&D 5e (2024 PHB) — armor, common weapons, languages (ch. 6 equipment).
# Armor Class: light = base + DEX; medium = base + min(DEX, 2); heavy = base (no DEX).
armor:
- id: none
  label: Unarmored
  category: none
  base_ac: 10
  add_dex: true
- id: padded
  label: Padded
  category: light
  base_ac: 11
  add_dex: true
- id: leather
  label: Leather
  category: light
  base_ac: 11
  add_dex: true
- id: studded_leather
