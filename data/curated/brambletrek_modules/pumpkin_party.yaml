  spirit_catching:
    '7':
      label: A pink streak, quick and bright, races past.
      body: A pink streak, quick and bright, races past. "The rustle of silk, the warmth of stage lights—where
        have all the costumes gone?"
    '2':
      label: ''
    ace:
      label: mysterious blue light encircles you, its presence both ancient and serene.
      body: mysterious blue light encircles you, its presence both ancient and serene. "I have tales of
        old, lost in the winds of time. Where might I find echoes of my past?"
    '3':
      label: Hesitant and timid, a green glow flickers near you.
      body: Hesitant and timid, a green glow flickers near you. "The chirping of birds once filled my
        days. Where might I find them again?"
    '4':
      label: A bold, white orb shines with the confidence of a forgotten hero.
      body: A bold, white orb shines with the confidence of a forgotten hero. "I wielded swords and won
        great battles, but whence came I?"
    '5':
      label: ''
    '6':
      label: ''
    '8':
      label: Dragging slowly along, an aqua light murmurs with urgency.
      body: Dragging slowly along, an aqua light murmurs with urgency. "The deep calls to me, its dark
        embrace familiar. How do I return below?"
    '9':
      label: An orange orb blinks rapidly as it crosses your path.
      body: An orange orb blinks rapidly as it crosses your path. "My life among crystals, tinctures,
        and herbs—where did I leave my workshop?"
    '10':
      label: A dull grey orb appears suddenly, its presence heavy.
      body: A dull grey orb appears suddenly, its presence heavy. "Time is short and I must not dally.
        Where is the nearest cave?"
    jack:
      label: Darting about with vibrant energy, a colorful light seeks answers.
      body: Darting about with vibrant energy, a colorful light seeks answers. "I see visions of crystals,
        countless and bright. Where are they hidden?"
    queen:
      label: ''
    king:
      label: With a spark of urgency, a silver orb pulses.
      body: With a spark of urgency, a silver orb pulses. "I am called to heal, to aid the ailing, but
        I know not where they rest. Where must I go?"
  costume_contest:
    '8':
      label: Pumpkin's Charm
      body: Rounded and ribbed, your costume mirrors the cheerful visage of a carved pumpkin, lit from
        within.
    '2':
      label: Skeleton's Guise
      body: You don an ensemble of eerie, bone-white attire, mimicking the rattling dance of a skeleton
        in the moonlight.
    '3':
      label: Mystic Mushroom
      body: Cloaked in a cap and stem, your costume embodies a whimsical mushroom, dotted with faux dewdrops.
    '4':
      label: Bat's Winged Silhouette
      body: With wings outstretched, you embody the silent, fleeting shadow of a bat under the night sky.
    '5':
      label: Lycan's Hide
      body: Fur bristles along your costume as you take on the form of a fearsome werewolf, eyes glowing
        with feral intensity.
    '6':
      label: Vampire's Elegance
      body: Draped in a cloak as dark as the night, your vampire costume comes complete with sharp, shining
        fangs.
    '7':
      label: Wizard's Robes
      body: Adorned in starlit robes and a pointed hat, you channel the arcane wisdom of a seasoned wizard.
    '9':
      label: Dragon's Majesty
      body: Scales shimmer across your costume, with a tail that sweeps and a roar that echoes ancient
        power.
    '10':
      label: Warrior's Armor
      body: Clad in battle-worn armor, you stand ready to defend the festivities as a noble warrior of
        old.
    jack:
      label: Jester's Folly
      body: Colorful and whimsical, your jester's attire jingles with every mischievous step you take.
    queen:
      label: Ghost's Whisper
      body: Ethereal and flowing, your ghost costume seems to drift on unseen breezes, hauntingly beautiful.
    king:
      label: Royal Regalia
      body: Majestic and imposing, your royal garb commands respect with its rich fabrics and regal adornments.
    ace:
      label: Phoenix's Rebirth
      body: Resplendent in fiery reds and golds, your costume symbolizes the mythical phoenix, reborn
        from ash.
  pie_tasting:
    '10':
      label: Pear Pie Tart and sweet, decorated whimsically with pastry mice, it's a playful twist on
        a traditional fruit pie.
      body: Pear Pie Tart and sweet, decorated whimsically with pastry mice, it's a playful twist on a
        traditional fruit pie. JA CKNettle Pie Earthy and unexpected, this pie reminds you of woodland
        walks and the tang of fresh nettles.
    '2':
      label: Apple Pie A classic delight, this pie is brimming with spiced apple slices nestled in a flaky
        crust.
    '3':
      label: Cherry Pie Vibrantly red and sweet, this pie's glistening cherries offer a burst of flavor
        with every bite.
    '4':
      label: Chestnut Pie Light and nutty, this pie offers a subtle, earthy flavor, perfect for a crisp
        autumn evening.
    '5':
      label: Maple Pie Thick and gooey, this golden pie is a sweet homage to the maple trees surrounding
        the village.
    '6':
      label: Sticky Toffee Pie Rich and decadent, the sticky toffee clings to your teeth,
    ace:
      label: Custard Pie Creamy and comforting, topped with dollops of cream, it's a soothing end to a
        festive evening.
    '7':
      label: Cheese and Onion Pie
    '8':
      label: Pumpkin Pie The essence of autumn packed into a pie, with a creamy filling and a hint of
        spice.
    '9':
      label: Berry Pie Bursting with wild berries from the local woods, this pie is a colorful treat for
        the senses.
    queen:
      label: Golden Honey Syrup Pie Lusciously sweet and thick, it's a decadent treat that's almost too
        rich to finish.
    king:
      label: Ghost Pie An enigmatic offering that seems almost ethereal, leaving a lingering taste of
        something unforgettable.
notes:
- Draw for festival role and companion at start; up to 3 choose-your-adventure draws.
- Route each draw through choose_adventure then the linked scene table.
