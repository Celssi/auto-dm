play:
  journey_cards_per_day: 1
  use_core_depths: false
  use_core_combat: true
  reason_key: band
  default_scene_table: choose_adventure
journey_heading: '**Pumpkin Party** — choose your activity (up to 3 draws)'
scene_tables:
  festival_role:
    '3':
      label: Costume Conjurer Noticing a lack of costumes, you dash to the tailor’s to craft delightful
        disguises for everyone.
    '2':
      label: Master Carver The pumpkin carving station awaits your creative touch.
      body: Master Carver The pumpkin carving station awaits your creative touch. Carve intricate designs
        that tell tales of old.
    '4':
      label: Baker's Apprentice Inspired by family traditions, you join the bakers to whip up your favorite
        festive treats.
    '5':
      label: Chief Organizer With chaos around, you step up to coordinate the tasks and ensure everything
        goes smoothly.
    '6':
      label: Scarecrow Sentinel As crows menace the pumpkin patch, you fashion a scare to keep these pesky
        birds at bay.
    '7':
      label: Face Painter Armed with colorful berry pastes, you decorate faces with symbols of harvest
        and folklore.
    '8':
      label: Basket Weaver You weave sturdy baskets perfect for gathering treats under the moonlit sky.
    '9':
      label: Decorator Supreme Feeling the area could use more flair, you craft additional decorations
        to enhance the festive vibe.
    '10':
      label: Music Maestro The quiet whispers of more music; you organize a troupe to fill the air with
        harmonious melodies.
    jack:
      label: Potion Mixer Amidst the bustling crowd, you concoct your famous drink that's sure to lift
        spirits.
    queen:
      label: Lightbringer To comfort children afraid of the dark, you illuminate the party with enchanting
        fairy lights.
    king:
      label: Leader of the Band Seeing the need for leadership, you guide the villagers in setting up
        and running the event smoothly.
    ace:
      label: Magician of the Eve Believing no party is complete without a touch of magic, you dazzle the
        crowd with mysterious tricks
      body: Magician of the Eve Believing no party is complete without a touch of magic, you dazzle the
        crowd with mysterious tricks. Y OUR R OLE A T THE P ARTY As the festive preparations for the Pumpkin
        Party are underway, each Gnawborn has a special role to play. Your contribution is essential to
        bring the spirit of the festival alive.
  party_companion:
    '4':
      label: The Generous Cook Bearing a bowl of steaming pumpkin soup, the village cook offers you a
        taste.
    '2':
      label: The Raven Scribe A wise raven with a basket full of mysterious runes approaches you.
    '3':
      label: Bristleback Buddy The spiky silhouette of a bristleback emerges, eager to join in the fun.
    '5':
      label: Firefly Flicker
    ace:
      label: Mysterious Masquerader An unknown figure in a spectacular costume approaches, their identity
        a playful mystery.
      body: Mysterious Masquerader An unknown figure in a spectacular costume approaches, their identity
        a playful mystery. COMP ANIONS A T THE P ARTY As the last touches of decoration brighten the clearing
        and the festive air fills with laughter, you pause to take in the beauty of it all. The evening
        is alight with joy and the glow of fireflies. Amidst this magical ambiance, a familiar figure
        approaches.
    '6':
      label: Childhood Friend Your oldest friend runs up with a wide smile, ready to reminisce and make
        new memories.
    '7':
      label: The Friendly Ghost A glowing apparition floats by your side, its presence comforting and
        cheerful.
    '8':
      label: The Wise Herbalist The village herbalist, curious about your latest adventures, meets you
        with a bundle of fresh herbs.
    '9':
      label: Beloved Kin A family member you haven’t seen in ages approaches with a warm, welcoming embrace.
    '10':
      label: Will-o'-the-Wisp A soft, pulsing light of a will-o’-wisp floats near, its dance enchanting
        and inviting.
    jack:
      label: Forest Fox A curious fox, larger than usual, peeks from the trees, its eyes sparkling with
        mischief.
    queen:
      label: Children's Brigade A group of energetic children surround you, their eyes wide with wonder,
        eager for stories.
    king:
      label: The Village Mayor The mayor approaches, his handshake firm and grateful, acknowledging your
        contributions.
  choose_adventure:
    hearts:
      label: Pumpkin Hunt
      scene_table: pumpkin_hunt
      body: Venture into the pumpkin patch. Use the pumpkin hunt table.
    diamonds:
      label: Spirit Catching
      scene_table: spirit_catching
      body: Engage with ethereal guests. Use the spirit catching table.
    clubs:
      label: Costume Contest
      scene_table: costume_contest
      body: Show off your costume. Use the costume contest table.
    spades:
      label: Pie Tasting
      scene_table: pie_tasting
      body: Sample pies from village bakers. Use the pie tasting table.
