play:
  journey_cards_per_day: 3
  use_core_depths: false
  use_core_combat: false
  reason_key: rank
journey_heading: '**Heimstre (World Tree)** — three exploration events per day'
reasons:
  '2':
    title: Family Legacy
    label: Family Legacy
    body: You stumble upon an ancient journal, worn by time. It reveals that one of your ancestors was
      a guardian of Heimstre. The World Tree beckons you to continue their legacy.
  '3':
    title: Ephemeral Dreams
    label: Ephemeral Dreams
    body: Night after night, you dream of a glowing sapling at the heart of Heimstre. It whispers that
      your destiny intertwines with the World Tree's very essence.
  '4':
    title: Lost Artefact
    label: Lost Artefact
    body: You've heard rumours of a sacred relic lost within the World Tree, said to have the power to
      reshape fate. Is it mere legend, or is there truth to the tales?
  '5':
    title: Nature's Imbalance
    label: Nature's Imbalance
    body: The forests of Hyhill seem changed, wilder. Old spirits murmur that the equilibrium of Heimstre
      has tilted. Only a Gnawborn can restore the balance.
  '6':
    title: Mystical Bond
    label: Mystical Bond
    body: An unknown force pulls you towards Heimstre. Every gust of wind, every rustle of leaves seems
      to guide your path, as if the World Tree itself beckons.
  '7':
    title: Guardian's Plea
    label: Guardian's Plea
    body: A spectral apparition of a former guardian of Heimstre appears in your camp. They plead for
      your help against a looming darkness within the tree.
  '8':
    title: Ancient Prophecy
    label: Ancient Prophecy
    body: In a secluded village, you come across an old seer. They recite a prophecy where a wandering
      Gnawborn restores light to Heimstre's heart.
  '9':
    title: Cursed Mark
    label: Cursed Mark
    body: A mysterious mark appears on your paw, tingling with power. Elders speak of it as the Sigil
      of Heimstre – a sign that the tree demands your presence.
  '10':
    title: Forgotten Melody
    label: Forgotten Melody
    body: A haunting tune, whispered by the winds, speaks of Heimstre's heart and a Gnawborn's role. The
      song feels eerily familiar, urging you to seek its source.
  jack:
    title: Vanishing Kin
    label: Vanishing Kin
    body: Gnawborns have been disappearing, drawn towards Heimstre. Whispers speak of a grand assembly
      within the tree's depths. Can you solve the mystery?
  queen:
    title: Echoes of Power
    label: Echoes of Power
    body: A surge of raw magical energy pulses from Heimstre, and you alone seem attuned to it. This power
      is both a beckoning call and
  ace:
    title: Tree's Heart Cry
    label: Tree's Heart Cry
    body: A profound sorrow emanates from Heimstre, felt deeply in your soul. The World Tree mourns, and
      it seems only you can comfort its ancient heart. Y OUR REASON TO ENTER HEIMSTRE As with character
      creation, this table can either be drawn on or chosen. When you feel like ending your adventure,
      you may head to the ‘True Ending’ page to determine the True ending that is based on these Reasons.
  king:
    title: Guardian's Fall
    label: Guardian's Fall
    body: Rumours spread that the current guardian of Heimstre is faltering. The World Tree requires a
      new protector, and perhaps you are the chosen one.
