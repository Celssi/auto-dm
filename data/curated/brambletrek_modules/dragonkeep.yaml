journey_heading: '**Dragonkeep exploration** — three events per path section'
path_locations:
  '1':
    title: Trees
    body: Trees — Amidst the dense forest, a clearing reveals an ancient tree. Its branches stretch skyward,
      whispering secrets of the ages. The air feels alive with the spirit of the forest, offering a moment
      of tranquillity and a sense of connection with nature's timeless rhythm.
  '2':
    title: Forgotten Equipment
    body: Forgotten Equipment — In a secluded nook, you stumble upon remnants of a past traveller's equipment.
      The items lay scattered, touched by time and the elements, hinting at tales untold and adventures
      that once echoed through these woods.
    suit_outcomes:
      hearts:
        label: A well-preserved backpack contains useful supplies. (+3 Supplies)
        supplies: 3
      diamonds:
        label: A map among the equipment reveals a shortcut. (+2 Morale)
        morale: 2
      clubs:
        label: A trap set by a previous adventurer springs. (-3 Health)
        health: -3
      spades:
        label: The equipment crumbles to dust as you touch it. (-1 Morale)
        morale: -1
  '3':
    title: Crates
    body: Crates — Hidden under a canopy of leaves, a stack of wooden crates awaits. Weathered and worn,
      they are silent sentinels of forgotten supplies or secrets. What stories do they hold? What purpose
      did they once serve in this secluded forest?
  '4':
    title: Cave Door
    body: Cave Door — Right at the edge of the forest, a small cave opening is visible, about the size
      of a small rodent, vines seem to drape over the top. As you get closer, you hear a slight hum, it
      vibrates your ears slightly, and you get the feeling of magical energy coursing through your tiny
      hands. If you decide to take your steps inside and travel within, please turn to the next section…
    suit_outcomes:
      hearts:
        label: You find a tranquil spot under a grand, ancient tree. (+2 Morale)
        morale: 2
      diamonds:
        label: A tree with carvings reveals a hidden compartment. (ITEM) (+1 Supplies)
        supplies: 1
        tags:
        - item
      clubs:
        label: You find nothing of note near the trees.
      spades:
        label: A seemingly benign tree suddenly drops a branch. (-2 Health)
        health: -2
  '5':
    title: Old Bonfire
    body: Old Bonfire — A circle of stones, blackened by old flames, speaks of a campfire long extinguished.
      Ashes and charred wood paint a picture of travellers resting here, sharing tales and warmth before
      continuing their journey into the unknown.
  '6':
    title: Runic Stone
    body: Runic Stone — In a quiet part of the forest stands a mysterious runic stone. Its ancient carvings
      pulse with a latent power, a relic of forgotten magic. The runes, etched by hands long gone, beckon
      with their arcane promise and hidden knowledge.
    suit_outcomes:
      hearts:
        label: The rune starts to glow. (Dwarf Rune - Take 1 less damage per turn in next combat)
      diamonds:
        label: The runes reveal the location of a hidden treasure. (+3 Supplies)
        supplies: 3
      clubs:
        label: The stone awakens a guardian. (Combat — King) (Use core rulebook combat info)
        combat: true
      spades:
        label: Misspeaking the runes triggers an attack. (-2 Health)
        health: -2
  '7':
    title: A Small Duck Pond
    body: A Small Duck Pond — Nestled in a quiet grove, you discover a serene duck pond. The water, clear
      and calm, reflects the lush greenery and the soft blue of the sky. Ducks glide gracefully across
      the surface, undisturbed by the world outside their tranquil haven.
    suit_outcomes:
      hearts:
        label: The log nearby has a small folded note about having confidence. (+2 Morale)
        morale: 2
      diamonds:
        label: Around the bonfire, you find a peaceful spot to rest. (+2 Health)
        health: 2
      clubs:
        label: The smoke attracts attention. (Combat — Jack) (Use core rulebook combat info)
        combat: true
      spades:
        label: A seemingly benign tree suddenly drops a branch. (-2 Health)
        health: -2
