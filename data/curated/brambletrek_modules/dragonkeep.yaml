  eolan:
    antechamber:
      body: Eolan tends his wound beside a makeshift camp. Thistle the squirrel watches from his staff.
        He seeks the Moon Dragon's treasure and proposes an alliance — together you may reach what he
        could not alone.
    door:
      body: The Door of Lunar Light bears a cryptic riddle. A slot fits the Oracle's relic; placing it
        opens the way to the Deep Chambers.
      requires: oracle_relic
    chambers:
      body: Wealth and a chained lunar drake fill the cavern. Aerith descends from the shadows — the guardian
        of the smaller drake. Combat with Eolan at your side is inevitable.
    combat_rules:
      body: 'Turn order: Aerith → You → Eolan. Each phase: discard hand and redraw 4 tactic cards. Survive
        one of each Aerith attack type to complete a phase (or meet damage goals). Red Ace/King on Eolan''s
        draw grants Critical Chance (double damage on your next damaging tactic). Two red face cards in
        a row completes the phase immediately.'
