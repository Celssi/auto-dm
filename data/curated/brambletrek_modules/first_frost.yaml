scene_tables:
  smores_tactics:
    '2':
      label: Sticky Dodge
      body: Smores catches a projectile with his sticky spikes, reducing incoming damage by 2.
      reduce_incoming: 2
      reduce_incoming_attacks: 1
    '3':
      label: Marshmallow Muddle
      body: Throws a marshmallow to blind an opponent, causing them to miss their next attack.
      evade_next: 1
    '4':
      label: Sweet Roll
      body: Smores rolls towards the enemy, dealing 3 damage and retreating swiftly to avoid a counterattack.
      damage: 3
    '5':
      label: Sugary Soothe
      body: Uses a marshmallow to restore 2 morale to a teammate and heal them for 1 health.
      morale: 2
      heal: 1
    '6':
      label: Protective Puff
      body: Puffs up to shield an ally, absorbing the next attack directed at them (up to 3 damage).
      reduce_incoming: 3
      reduce_incoming_attacks: 1
    '7':
      label: Spike Flurry
      body: Shakes off marshmallows causing 2 damage and confusion (enemies miss 50% of their attacks next turn).
      damage: 2
      opponent_miss_chance_next: 50
    '8':
      label: Sugar Rush
      body: Grants Smores or an ally a burst of energy, allowing for an immediate additional 2 actions after this
        card is played.
      extra_turns: 2
    '9':
      label: Candy Counter
      body: Uses sticky marshmallows to immobilise an enemy, preventing their next action.
      skip_opponent_turns: 1
    '10':
      label: Frosty Fortitude
      body: Smores fortifies himself against the cold, gaining 4 temporary health for the next 2 turns.
      temporary_health: 4
      temporary_health_turns: 2
    jack:
      label: Jolt
      body: Smores energises himself and all allies, increasing speed and reducing incoming damage by 1 for the next
        turn.
      reduce_incoming: 1
      reduce_incoming_attacks: 1
    queen:
      label: Quiet Quell
      body: Calms a hostile creature, reducing its damage output by half (rounded-down) for the next 2 turns.
      halve_opponent_damage_turns: 2
      halve_opponent_damage_round: down
    king:
      label: Guard
      body: Assumes a defensive stance, doubling his defence and reflecting 2 damage back at the attacker for 3 turns.
      reflect_damage: 2
      reflect_turns: 3
    ace:
      label: Sticky Ambush
      body: Executes a powerful attack dealing damage equal to the total number of marshmallows on him. (Draw a card
        and halve the value - rounded up).
      damage_formula: draw_half_up
  snacker_tactics:
    '2':
      label: Skillet Shield
      body: Quickly raise your skillet to block, reducing the next attack's damage by 2.
      reduce_incoming: 2
      reduce_incoming_attacks: 1
    '3':
      label: Pepper Flash
      body: Toss a pinch of blinding pepper at your opponent, dealing 3 damage.
      damage: 3
    '4':
      label: Oil Slip
      body: Throw a slick of oil under the opponent, causing them to slip and miss their next attack.
      evade_next: 1
    '5':
      label: Quick Sip Broth
      body: Take a swift sip from your prepared broth to restore 4 health.
      heal: 4
    '6':
      label: Rolling Pin Swing
      body: Swing your rolling pin in a quick, fierce arc, dealing 3 damage.
      damage: 3
    '7':
      label: Utensil Barrage
      body: Fling a barrage of utensils in a swift motion, dealing 4 damage.
      damage: 4
    '8':
      label: Energising Bite
      body: Eat a bite of an energising snack to boost your damage by 2 for the next turn.
      damage_bonus: 2
      damage_bonus_attacks: 1
    '9':
      label: Grease Trap
      body: Toss a handful of slippery grease at your opponent's feet, making them deal 2 extra damage
        but take 4 damage.
      damage: 4
      opponent_damage_bonus: 2
      opponent_damage_bonus_turns: 1
    '10':
      label: Hot Soup Splash
      body: Splash hot soup from your ladle, dealing 3 damage and restoring 3 health to yourself.
      damage: 3
      heal: 3
    jack:
      label: Distraction Dish
      body: Toss a dish in the air to distract, causing the opponent to skip their next turn.
      skip_opponent_turns: 1
    queen:
      label: Revitalising Refreshment
      body: Consume a quick refreshment that restores 5 health and adds 2 damage to your next attack.
      heal: 5
      damage_bonus: 2
      damage_bonus_attacks: 1
    king:
      label: Double Dish
      body: Draw 2 cards and take an additional 2 turns immediately after this card is played.
      draw_tactics: 2
      extra_turns: 2
    ace:
      label: Ultimate Feast
      body: Serve a feast in a flash that deals damage equal to half your current supplies, rounded up.
      damage_formula: half_supplies
