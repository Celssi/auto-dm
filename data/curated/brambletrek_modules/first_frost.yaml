scene_tables:
  snacker_tactics:
    '2':
      label: Skillet Shield
      body: Quickly raise your skillet to block, reducing the next attack's damage by 2.
    '3':
      label: Pepper Flash
      body: Toss a pinch of blinding pepper at your opponent, dealing 3 damage.
    '4':
      label: Oil Slip
      body: Throw a slick of oil under the opponent, causing them to slip and miss their next attack.
    '5':
      label: Quick Sip Broth
      body: Take a swift sip from your prepared broth to restore 4 health.
    '6':
      label: Rolling Pin Swing
      body: Swing your rolling pin in a quick, fierce arc, dealing 3 damage.
    '7':
      label: Utensil Barrage
      body: Fling a barrage of utensils in a swift motion, dealing 4 damage.
    '8':
      label: Energising Bite
      body: Eat a bite of an energising snack to boost your damage by 2 for the next turn.
    '9':
      label: Grease Trap
      body: Toss a handful of slippery grease at your opponent's feet, making them deal 2 extra damage
        but take 4 damage.
    '10':
      label: Hot Soup Splash
      body: Splash hot soup from your ladle, dealing 3 damage and restoring 3 health to yourself.
    jack:
      label: Distraction Dish
      body: Toss a dish in the air to distract, causing the opponent to skip their next turn.
    queen:
      label: Revitalising Refreshment
      body: Consume a quick refreshment that restores 5 health and adds 2 damage to your next attack.
    king:
      label: Double Dish
      body: Draw 2 cards and take an additional 2 turns immediately after this card is played.
    ace:
      label: Ultimate Feast
      body: Serve a feast in a flash that deals damage equal to half your current supplies, rounded up.
