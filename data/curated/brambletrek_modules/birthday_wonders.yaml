scene_tables:
  skaeven_tactics:
    '8':
      label: THE WORLD TREE After days of searching, your journey finally brings you to the base of the
        World Tree.
      body: THE WORLD TREE After days of searching, your journey finally brings you to the base of the
        World Tree. Its vast roots curl like the arms of a guardian, and its branches rise until they
        vanish into the heavens. The air here is hushed, filled with a pulse of ancient power. Bramble
        points upward, eyes shining. “This is it,” he whispers. “The greatest gift for Brambletrek must
        be here. Nothing else could be worthy.” But before you can step closer, shadows stir among the
        roots. From the undergrowth emerge the Ratkin, lean and ragged, their eyes sharp with hunger and
        greed. They hiss and chatter amongst themselves, clutching crude blades and broken spears. “We
        know you carry something precious,” one sneers. “Hand it over, and perhaps we let you leave in
        peace.” You protest that you do not yet have the gift, but the Ratkin do not listen. In their
        envy they see only prey, and they surge forward to claim what they imagine is already yours. THE
        AMBUSH This encounter uses the Tactic Rules from the Brambletrek core book (see page 29). Each
        player draws 4 Tactic Cards, and the Ratkin act by drawing their own tactic card on each of their
        turns. The fight lasts until either side retreats or falls. The Ratkin are a Jack-tier opponent
        with 10 Health. Treat them as a single enemy swarm. Their attacks should be flavoured as darting
        strikes, snapping teeth, and overwhelming numbers. When you draw their Tactic Cards, narrate them
        as the desperate, reckless actions of the Ratkin mob. Fight for one full round. Describe how your
        Gnawborn resist the ambush, what allies do, and how the cousins defend one another against the
        sudden attack. Once you finish the first round of combat, turn the page to continue the story.
