[project]
name = "auto-dm"
version = "0.1.0"
description = "Automated D&D 5e 2024 solo DM with RAG, character sheets, and Claude Opus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-ollama>=0.11.0",
    "llama-index-llms-ollama>=0.12.0",
    "llama-index-llms-anthropic>=0.13.0",
    "llama-index-vector-stores-chroma>=0.7.0",
    "langchain-core>=1.8.3",
    "langchain-anthropic>=1.7.11",
    "langgraph>=1.2.23",
    "langsmith>=0.15.0",
    "langchain-ollama>=1.1.0",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "cryptography>=50.0.2",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.7.0",
    "sentence-transformers>=6.3.0,<6.5",
    "transformers>=5.23.0,<6",
    "einops>=0.8.2",
    "pydantic>=2.14.4",
    "firebase-admin>=7.8.0",
    "google-cloud-storage>=3.17.1",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
