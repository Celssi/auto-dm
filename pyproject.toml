[project]
name = "auto-dm"
version = "0.1.0"
description = "Automated D&D 5e 2024 solo DM with RAG, character sheets, and Claude Opus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-llms-anthropic>=0.12.2",
    "llama-index-vector-stores-chroma>=0.6.0",
    "langchain-core>=1.6.9",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "langsmith>=0.14.7",
    "langchain-ollama>=1.1.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "cryptography>=50.0.2",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.5.0",
    "sentence-transformers>=6.1.0",
    "pydantic>=2.14.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
