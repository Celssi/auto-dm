# Cloud Build for Cloud Run — reuses Kirjasto Firebase secrets in project celssi
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build --no-cache \
          --build-arg VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
          --build-arg VITE_FIREBASE_PROJECT_ID=$$VITE_FIREBASE_PROJECT_ID \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
          --build-arg VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
          --build-arg VITE_ALLOWED_EMAILS=$_ALLOWED_EMAILS \
          -t $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          -f Dockerfile \
          '.'
    id: Build
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_PROJECT_ID
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - "--platform=managed"
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - "--region=$_DEPLOY_REGION"
      - "--port=8080"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=8Gi"
      - "--timeout=900"
      - "--quiet"
      - "--set-env-vars=AUTO_DM_BUCKET=$_DATA_BUCKET,ALLOWED_EMAILS=$_ALLOWED_EMAILS,FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID,GOOGLE_CLOUD_PROJECT=$_AR_PROJECT_ID"
      - "--set-secrets=ANTHROPIC_API_KEY=AUTO_DM_ANTHROPIC_API_KEY:latest"
    id: Deploy
    entrypoint: gcloud
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
availableSecrets:
  secretManager:
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_PROJECT_ID/versions/latest
      env: VITE_FIREBASE_PROJECT_ID
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID
timeout: 3600s
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
substitutions:
  _SERVICE_NAME: auto-dm
  _REPO_NAME: auto-dm
  _DEPLOY_REGION: europe-north1
  _AR_HOSTNAME: europe-north1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: celssi
  _DATA_BUCKET: celssi-auto-dm
  _FIREBASE_PROJECT_ID: kirjasto-celssi
  _ALLOWED_EMAILS: lauri.mukkala.fi@gmail.com
  _TRIGGER_ID: ""
tags:
  - gcp-cloud-build-deploy-cloud-run
  - auto-dm
