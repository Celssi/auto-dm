# Cloud Build for Cloud Run — reuses Kirjasto Firebase secrets in project celssi
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build --no-cache \
          --build-arg VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
          --build-arg VITE_FIREBASE_PROJECT_ID=$$VITE_FIREBASE_PROJECT_ID \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
          --build-arg VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
          --build-arg VITE_ALLOWED_EMAILS=$_ALLOWED_EMAILS \
          -t $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          -f Dockerfile \
          '.'
    id: Build
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_PROJECT_ID
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: EnsureTicketSecret
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRET_NAME=AUTO_DM_TICKET_SECRET
        PROJECT="$_AR_PROJECT_ID"
        if gcloud secrets describe "$$SECRET_NAME" --project="$$PROJECT" >/dev/null 2>&1; then
          echo "Secret $$SECRET_NAME already exists"
        else
          umask 077
          openssl rand -base64 48 > /tmp/auto-dm-ticket
          gcloud secrets create "$$SECRET_NAME" \
            --project="$$PROJECT" \
            --replication-policy=automatic \
            --data-file=/tmp/auto-dm-ticket
          rm -f /tmp/auto-dm-ticket
          echo "Created secret $$SECRET_NAME"
        fi
        PROJECT_NUMBER="$$(gcloud projects describe "$$PROJECT" --format='value(projectNumber)')"
        RUNTIME_SA="$$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        gcloud secrets add-iam-policy-binding "$$SECRET_NAME" \
          --project="$$PROJECT" \
          --member="serviceAccount:$$RUNTIME_SA" \
          --role="roles/secretmanager.secretAccessor" \
          --quiet
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - "--platform=managed"
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - "--region=$_DEPLOY_REGION"
      - "--port=8080"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=8Gi"
      - "--min-instances=0"
      - "--timeout=3600"
      - "--quiet"
      - "--set-env-vars=AUTO_DM_BUCKET=$_DATA_BUCKET,ALLOWED_EMAILS=$_ALLOWED_EMAILS,FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID,GOOGLE_CLOUD_PROJECT=$_AR_PROJECT_ID"
      - "--set-secrets=ANTHROPIC_API_KEY=AUTO_DM_ANTHROPIC_API_KEY:latest,AUTO_DM_TICKET_SECRET=AUTO_DM_TICKET_SECRET:latest"
    id: Deploy
    entrypoint: gcloud
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: VerifyTickets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe "$_SERVICE_NAME" \
          --region="$_DEPLOY_REGION" \
          --project="$_AR_PROJECT_ID" \
          --format='yaml(spec.template.spec.containers[0].env)' \
          | grep -q AUTO_DM_TICKET_SECRET
        echo "AUTO_DM_TICKET_SECRET is mounted on Cloud Run"
        URL="$$(gcloud run services describe "$_SERVICE_NAME" --region="$_DEPLOY_REGION" --project="$_AR_PROJECT_ID" --format='value(status.url)')"
        CODE="$$(curl -sS -o /tmp/ticket-body -w '%{http_code}' "$$URL/api/books/dnd5e/player.pdf/ticket?game_id=dnd5e")"
        echo "Unauthenticated ticket HTTP $$CODE"
        if [ "$$CODE" = "500" ]; then
          echo "Book tickets still return 500" >&2
          exit 1
        fi
        if [ "$$CODE" != "401" ] && [ "$$CODE" != "200" ]; then
          echo "Unexpected ticket status $$CODE" >&2
          exit 1
        fi
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
availableSecrets:
  secretManager:
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_PROJECT_ID/versions/latest
      env: VITE_FIREBASE_PROJECT_ID
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$_AR_PROJECT_ID/secrets/KIRJASTO_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID
timeout: 3600s
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
substitutions:
  _SERVICE_NAME: auto-dm
  _REPO_NAME: auto-dm
  _DEPLOY_REGION: europe-north1
  _AR_HOSTNAME: europe-north1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: celssi
  _DATA_BUCKET: celssi-auto-dm
  _FIREBASE_PROJECT_ID: kirjasto-celssi
  _ALLOWED_EMAILS: lauri.mukkala.fi@gmail.com
  _TRIGGER_ID: ""
tags:
  - gcp-cloud-build-deploy-cloud-run
  - auto-dm
