<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Auto-DM">
  <rect width="512" height="512" fill="#FAF6EE"/>
  <g transform="translate(0, 48) scale(0.88)">

  <!-- spike shell -->
  <path fill="#8B5A32" stroke="#4A2E1C" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"
        d="M 150 385
           C 108 360 88 330 78 300
           L 52 292 L 82 268
           L 48 240 L 88 228
           L 58 188 L 106 192
           L 86 148 L 132 168
           L 128 118 L 172 152
           L 188 108 L 214 150
           L 248 118 L 250 162
           C 268 168 278 184 276 204
           C 240 188 190 210 168 250
           C 148 288 142 336 150 385
           Z"/>

  <!-- cream face + belly; left edge overlaps the spike shell so no gap shows -->
  <path fill="#F3E2C8" stroke="#4A2E1C" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"
        d="M 250 200
           C 280 168 325 162 358 180
           C 390 168 428 190 438 228
           C 448 258 438 286 412 300
           C 388 312 355 336 318 348
           C 275 362 225 378 188 368
           C 150 356 142 318 152 280
           C 162 242 200 210 250 200
           Z"/>

  <!-- ear -->
  <path fill="#F3E2C8" stroke="#4A2E1C" stroke-width="16" stroke-linejoin="round"
        d="M 300 202
           C 292 168 304 138 322 132
           C 344 126 358 150 350 180
           C 344 198 322 210 300 202
           Z"/>
  <ellipse cx="328" cy="166" rx="12" ry="16" fill="#E8C8A0" transform="rotate(-18 328 166)"/>

  <!-- eye + tiny highlight -->
  <circle cx="356" cy="228" r="14" fill="#4A2E1C"/>
  <circle cx="361" cy="223" r="4.5" fill="#F3E2C8"/>
  <!-- nose, inset from the snout tip so it reads clearly -->
  <ellipse cx="422" cy="236" rx="14" ry="12" fill="#4A2E1C"/>
  <!-- smile -->
  <path d="M 384 258 Q 402 276 422 258" fill="none" stroke="#4A2E1C" stroke-width="10" stroke-linecap="round"/>


  <path fill="#F3E2C8" stroke="#4A2E1C" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
        d="M 278 312
           C 300 328 328 336 354 324
           C 368 316 370 300 358 292
           C 344 284 322 292 300 298
           C 286 302 278 306 278 312
           Z"/>

  </g>
  <g transform="rotate(-20 310 168)">
    <path d="M 310 18 L 390 188 L 230 188 Z" fill="#0F5F6E" stroke="#0C4C58" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="310" cy="190" rx="108" ry="26" fill="#0F5F6E" stroke="#0C4C58" stroke-width="14"/>
    <rect x="242" y="158" width="136" height="24" rx="6" fill="#F3E2C8" stroke="#4A2E1C" stroke-width="8"/>
    <circle cx="310" cy="18" r="18" fill="#F3E2C8" stroke="#4A2E1C" stroke-width="10"/>
  </g>
  <g transform="translate(348, 312)">
    <polygon points="64,2 120,34 120,94 64,126 8,94 8,34" fill="#0F5F6E" stroke="#0C4C58" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 64 2 L 64 126 M 8 34 L 120 94 M 120 34 L 8 94"
          stroke="#F3E2C8" stroke-width="5" stroke-linejoin="round" opacity="0.55"/>
    <polygon points="64,26 94,44 94,80 64,98 34,80 34,44" fill="#1A7A8A" stroke="#F3E2C8" stroke-width="4" stroke-linejoin="round"/>
  </g>

</svg>
